name: WingDesk deployment

on:
  push:
    branches: [main]
    paths:
      - release-request.json
      - deployment/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wingdesk-deployment
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out uploaded candidate
        uses: actions/checkout@v4
      - name: Test deployment guards
        run: python3 -m unittest discover -s deployment -p 'test_*.py'
      - name: Validate, publish and verify public download
        run: python3 deployment/release.py --publish --verify-public
